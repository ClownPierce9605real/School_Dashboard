<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Workspace & Study Hub</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --warning: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 1000px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
    }

    /* NAVIGATION TABS */
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      background: var(--card-bg);
      padding: 0.4rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      justify-content: center;
      width: 100%;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      flex: 1;
      max-width: 250px;
      text-align: center;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: white;
    }

    /* CONTAINER & TABS DISPLAY */
    .container {
      width: 100%;
      max-width: 1000px;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CARDS & GRID */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-weight: 600;
    }

    /* WARNING BANNER */
    .warning-banner {
      background-color: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--warning);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
    }

    .warning-title {
      color: var(--warning);
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .alert-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      font-size: 0.95rem;
    }

    .alert-item:last-child {
      border-bottom: none;
    }

    .alert-item.overdue {
      color: var(--danger);
    }

    .alert-link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .alert-link:hover {
      text-decoration: underline;
    }

    /* CLOCK & TIMER */
    .center-text {
      text-align: center;
    }

    #clock-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.8rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }

    #clock-date {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.5rem;
      font-weight: 700;
      margin: 0.5rem 0 1rem 0;
      color: var(--text-main);
    }

    .timer-modes {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .btn-mode {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-mode.active, .btn-mode:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* FORMS & INPUTS */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .input-field, textarea, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    .input-field:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: white;
    }

    /* TABLE / LIST STYLES */
    .item-list {
      list-style: none;
      width: 100%;
    }

    .item-card {
      background-color: var(--bg);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .item-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .item-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
    }

    .badge-progress { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .badge-done { background: rgba(16, 185, 129, 0.2); color: var(--success); }

    /* FOOTER LINKS */
    .quick-links {
      margin-top: auto;
      padding-top: 2rem;
      display: flex;
      gap: 1.5rem;
    }

    .quick-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .quick-links a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>💻 Dev Student Hub</h1>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('hub')">Main Hub</button>
      <button class="tab-btn" onclick="switchTab('assignments')">School Assignments</button>
      <button class="tab-btn" onclick="switchTab('workspace')">Notes & Project Log</button>
    </nav>
  </header>

  <div class="container">

    <!-- TAB 1: MAIN HUB -->
    <div id="tab-hub" class="tab-content active">
      
      <!-- Dynamic Assignment Alerts Banner -->
      <div id="urgent-alert-container"></div>

      <div class="grid-2">
        <!-- Clock & Date -->
        <div class="card center-text">
          <div class="card-title">Local Time & Date</div>
          <div id="clock-time">00:00:00 AM</div>
          <div id="clock-date">Loading date...</div>
        </div>

        <!-- Focus Timer -->
        <div class="card center-text">
          <div class="card-title">Focus Timer</div>
          <div class="timer-modes">
            <button class="btn-mode active" onclick="setTimerMode(25, this)">Work (25m)</button>
            <button class="btn-mode" onclick="setTimerMode(5, this)">Short Break (5m)</button>
            <button class="btn-mode" onclick="setTimerMode(15, this)">Long Break (15m)</button>
          </div>
          <div class="timer-display" id="timer-display">25:00</div>
          <div>
            <button class="btn" id="start-btn" onclick="toggleTimer()">Start</button>
            <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
          </div>
        </div>
      </div>

    </div>

    <!-- TAB 2: SCHOOL ASSIGNMENTS -->
    <div id="tab-assignments" class="tab-content">
      <div class="card">
        <div class="card-title">Add New Assignment</div>
        <form id="assignment-form" onsubmit="addAssignment(event)">
          <div class="form-group">
            <input type="text" id="assign-name" class="input-field" placeholder="Assignment Name (e.g., CS101 Project 1)" required>
            <input type="url" id="assign-link" class="input-field" placeholder="Link (e.g., https://canvas.edu/assignment/123)">
            <input type="datetime-local" id="assign-due" class="input-field" required>
          </div>
          <button type="submit" class="btn">Add Assignment</button>
        </form>
      </div>

      <div class="card">
        <div class="card-title">Your Assignments</div>
        <ul id="assignment-list" class="item-list"></ul>
      </div>
    </div>

    <!-- TAB 3: NOTES & PROJECT LOG -->
    <div id="tab-workspace" class="tab-content">
      <div class="grid-2">
        <!-- Text Documents / Quick Notes -->
        <div class="card">
          <div class="card-title">Text Documents / Notes</div>
          <div class="form-group">
            <input type="text" id="note-title" class="input-field" placeholder="Document Title...">
            <textarea id="note-content" rows="5" placeholder="Write your notes, specs, or draft code here..."></textarea>
            <button class="btn" onclick="saveNote()">Save Note</button>
          </div>
          <hr style="border-color: var(--border); margin: 1rem 0;">
          <div id="notes-list" class="item-list"></div>
        </div>

        <!-- Project Tracker -->
        <div class="card">
          <div class="card-title">Project Log</div>
          <div class="form-group">
            <input type="text" id="proj-name" class="input-field" placeholder="Project Title">
            <input type="url" id="proj-link" class="input-field" placeholder="GitHub Repo Link">
            <select id="proj-status">
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
            <textarea id="proj-desc" rows="2" placeholder="Brief project description or logs..."></textarea>
            <button class="btn" onclick="addProject()">Log Project</button>
          </div>
          <hr style="border-color: var(--border); margin: 1rem 0;">
          <div id="projects-list" class="item-list"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="quick-links">
    <a href="https://github.com" target="_blank">🔗 GitHub</a>
    <a href="https://stackoverflow.com" target="_blank">🔗 Stack Overflow</a>
    <a href="https://developer.mozilla.org" target="_blank">🔗 MDN Web Docs</a>
  </div>

  <script>
    /* ================= TAB SWITCHING ================= */
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'hub') {
        checkDueWarnings();
      }
    }

    /* ================= CLOCK & DATE ================= */
    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', { 
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
      });
      document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', { 
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ================= FOCUS TIMER ================= */
    let timerInterval = null;
    let totalSeconds = 25 * 60;
    let initialSeconds = 25 * 60;
    let isRunning = false;

    function updateTimerDisplay() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      document.getElementById('timer-display').textContent = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function toggleTimer() {
      const startBtn = document.getElementById('start-btn');
      if (isRunning) {
        clearInterval(timerInterval);
        startBtn.textContent = 'Start';
        isRunning = false;
      } else {
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            alert('Timer finished!');
            resetTimer();
          }
        }, 1000);
        startBtn.textContent = 'Pause';
        isRunning = true;
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      totalSeconds = initialSeconds;
      isRunning = false;
      document.getElementById('start-btn').textContent = 'Start';
      updateTimerDisplay();
    }

    function setTimerMode(minutes, element) {
      document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      initialSeconds = minutes * 60;
      resetTimer();
    }

    /* ================= SCHOOL ASSIGNMENTS ================= */
    let assignments = JSON.parse(localStorage.getItem('hub_assignments')) || [];

    function saveAssignments() {
      localStorage.setItem('hub_assignments', JSON.stringify(assignments));
      renderAssignments();
      checkDueWarnings();
    }

    function addAssignment(e) {
      e.preventDefault();
      const name = document.getElementById('assign-name').value;
      const link = document.getElementById('assign-link').value;
      const due = document.getElementById('assign-due').value;

      assignments.push({ id: Date.now(), name, link, due, completed: false });
      document.getElementById('assignment-form').reset();
      saveAssignments();
    }

    function toggleAssignment(id) {
      assignments = assignments.map(a => a.id === id ? { ...a, completed: !a.completed } : a);
      saveAssignments();
    }

    function deleteAssignment(id) {
      assignments = assignments.filter(a => a.id !== id);
      saveAssignments();
    }

    function renderAssignments() {
      const list = document.getElementById('assignment-list');
      list.innerHTML = assignments.length === 0 ? '<p style="color:var(--text-muted)">No assignments listed.</p>' : '';

      assignments.forEach(a => {
        const dueDate = new Date(a.due);
        const li = document.createElement('li');
        li.className = 'item-card';
        li.innerHTML = `
          <div class="item-info">
            <span class="item-title" style="${a.completed ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">${escapeHTML(a.name)}</span>
            <span class="item-sub">Due: ${dueDate.toLocaleString()}</span>
            ${a.link ? `<a href="${a.link}" target="_blank" class="alert-link">Open Link ↗</a>` : ''}
          </div>
          <div style="display:flex; gap:0.5rem; align-items:center;">
            <input type="checkbox" ${a.completed ? 'checked' : ''} onclick="toggleAssignment(${a.id})">
            <button class="btn btn-danger" onclick="deleteAssignment(${a.id})">Delete</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    /* ================= WARNING BANNERS ON MAIN HUB ================= */
    function checkDueWarnings() {
      const alertContainer = document.getElementById('urgent-alert-container');
      const now = new Date();
      
      // Filter uncompleted assignments due within 3 days or overdue
      const urgent = assignments.filter(a => {
        if (a.completed) return false;
        const dueDate = new Date(a.due);
        const diffHours = (dueDate - now) / (1000 * 60 * 60);
        return diffHours <= 72; // Within 72 hours (3 days) or past due
      });

      if (urgent.length === 0) {
        alertContainer.innerHTML = '';
        return;
      }

      let html = `
        <div class="warning-banner">
          <div class="warning-title">⚠️ Upcoming / Overdue Assignment Alerts</div>
      `;

      urgent.forEach(a => {
        const dueDate = new Date(a.due);
        const isOverdue = dueDate < now;
        html += `
          <div class="alert-item ${isOverdue ? 'overdue' : ''}">
            <span><strong>${isOverdue ? '[OVERDUE]' : '[DUE SOON]'}:</strong> ${escapeHTML(a.name)} — Due: ${dueDate.toLocaleDateString()} ${dueDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
            ${a.link ? `<a href="${a.link}" target="_blank" class="alert-link">Open Link ↗</a>` : ''}
          </div>
        `;
      });

      html += `</div>`;
      alertContainer.innerHTML = html;
    }

    /* ================= NOTES & TEXT DOCUMENTS ================= */
    let notes = JSON.parse(localStorage.getItem('hub_notes')) || [];

    function saveNote() {
      const title = document.getElementById('note-title').value.trim();
      const content = document.getElementById('note-content').value.trim();

      if (!title || !content) {
        alert('Please provide both a title and content for your note.');
        return;
      }

      notes.push({ id: Date.now(), title, content, date: new Date().toLocaleDateString() });
      localStorage.setItem('hub_notes', JSON.stringify(notes));
      document.getElementById('note-title').value = '';
      document.getElementById('note-content').value = '';
      renderNotes();
    }

    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      localStorage.setItem('hub_notes', JSON.stringify(notes));
      renderNotes();
    }

    function renderNotes() {
      const list = document.getElementById('notes-list');
      list.innerHTML = notes.length === 0 ? '<p style="color:var(--text-muted)">No saved notes.</p>' : '';

      notes.forEach(n => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.style.flexDirection = 'column';
        div.style.alignItems = 'flex-start';
        div.innerHTML = `
          <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
            <span class="item-title">${escapeHTML(n.title)}</span>
            <button class="btn btn-danger" onclick="deleteNote(${n.id})">Delete</button>
          </div>
          <span class="item-sub" style="margin-bottom:0.5rem;">Saved on: ${n.date}</span>
          <p style="white-space: pre-wrap; font-size: 0.9rem; color: var(--text-main); font-family: 'JetBrains Mono', monospace; background: var(--card-bg); padding: 0.5rem; border-radius: 4px; width: 100%;">${escapeHTML(n.content)}</p>
        `;
        list.appendChild(div);
      });
    }

    /* ================= PROJECT LOG ================= */
    let projects = JSON.parse(localStorage.getItem('hub_projects')) || [];

    function addProject() {
      const name = document.getElementById('proj-name').value.trim();
      const link = document.getElementById('proj-link').value.trim();
      const status = document.getElementById('proj-status').value;
      const desc = document.getElementById('proj-desc').value.trim();

      if (!name) {
        alert('Please provide a project title.');
        return;
      }

      projects.push({ id: Date.now(), name, link, status, desc });
      localStorage.setItem('hub_projects', JSON.stringify(projects));
      
      document.getElementById('proj-name').value = '';
      document.getElementById('proj-link').value = '';
      document.getElementById('proj-desc').value = '';
      renderProjects();
    }

    function deleteProject(id) {
      projects = projects.filter(p => p.id !== id);
      localStorage.setItem('hub_projects', JSON.stringify(projects));
      renderProjects();
    }

    function renderProjects() {
      const list = document.getElementById('projects-list');
      list.innerHTML = projects.length === 0 ? '<p style="color:var(--text-muted)">No projects logged.</p>' : '';

      projects.forEach(p => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
          <div class="item-info">
            <span class="item-title">${escapeHTML(p.name)} 
              <span class="badge ${p.status === 'Completed' ? 'badge-done' : 'badge-progress'}">${p.status}</span>
            </span>
            ${p.desc ? `<span class="item-sub">${escapeHTML(p.desc)}</span>` : ''}
            ${p.link ? `<a href="${p.link}" target="_blank" class="alert-link">Repository / Link ↗</a>` : ''}
          </div>
          <button class="btn btn-danger" onclick="deleteProject(${p.id})">Delete</button>
        `;
        list.appendChild(div);
      });
    }

    /* ================= UTILS ================= */
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // INITIAL RENDERS
    renderAssignments();
    renderNotes();
    renderProjects();
    checkDueWarnings();
  </script>
</body>
</html>
