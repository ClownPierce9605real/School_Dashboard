<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Workspace & Study Hub</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      align-self: flex-start;
      font-weight: 600;
    }

    /* CLOCK & DATE STYLES */
    #clock-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.8rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }

    #clock-date {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* TIMER STYLES */
    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.5rem;
      font-weight: 700;
      margin: 0.5rem 0 1rem 0;
      color: var(--text-main);
    }

    .timer-modes {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .btn-mode {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-mode.active, .btn-mode:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .timer-controls {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    /* TO-DO LIST STYLES */
    .todo-card {
      grid-column: 1 / -1;
    }

    .todo-input-group {
      display: flex;
      width: 100%;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .todo-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .todo-input:focus {
      border-color: var(--accent);
    }

    .todo-list {
      list-style: none;
      width: 100%;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      border: 1px solid var(--border);
    }

    .todo-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .todo-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }

    .todo-content input[type="checkbox"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 0.25rem;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    /* QUICK LINKS SECTION */
    .quick-links {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }

    .quick-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .quick-links a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>&#128187; Dev Study Hub</h1>
    <p>Organize your school tasks, time your sprints, and focus.</p>
  </header>

  <div class="container">
    
    <!-- CLOCK & DATE WIDGET -->
    <div class="card">
      <div class="card-title">Local Time & Date</div>
      <div id="clock-time">00:00:00 AM</div>
      <div id="clock-date">Loading date...</div>
    </div>

    <!-- FOCUS TIMER WIDGET -->
    <div class="card">
      <div class="card-title">Focus Timer</div>
      <div class="timer-modes">
        <button class="btn-mode active" onclick="setTimerMode(25, this)">Work (25m)</button>
        <button class="btn-mode" onclick="setTimerMode(5, this)">Short Break (5m)</button>
        <button class="btn-mode" onclick="setTimerMode(15, this)">Long Break (15m)</button>
      </div>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button class="btn" id="start-btn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <!-- TO-DO LIST WIDGET -->
    <div class="card todo-card">
      <div class="card-title">Project Tasks & To-Do List</div>
      <div class="todo-input-group">
        <input type="text" id="todo-input" class="todo-input" placeholder="Add a new task (e.g., Finish CS Assignment 2)..." onkeypress="handleKeyPress(event)">
        <button class="btn" onclick="addTodo()">Add Task</button>
      </div>
      <ul class="todo-list" id="todo-list">
        <!-- Tasks will be injected here via JavaScript -->
      </ul>
    </div>

  </div>

  <div class="quick-links">
    <a href="https://github.com" target="_blank">&#128279; GitHub</a>
    <a href="https://stackoverflow.com" target="_blank">&#128279; Stack Overflow</a>
    <a href="https://developer.mozilla.org" target="_blank">&#128279; MDN Web Docs</a>
  </div>

  <script>
    /* ================= CLOCK & DATE ================= */
    function updateClock() {
      const now = new Date();
      
      // Format Time
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', timeOptions);

      // Format Date
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', dateOptions);
    }
    setInterval(updateClock, 1000);
    updateClock();


    /* ================= FOCUS TIMER ================= */
    let timerInterval = null;
    let totalSeconds = 25 * 60;
    let initialSeconds = 25 * 60;
    let isRunning = false;

    const timerDisplay = document.getElementById('timer-display');
    const startBtn = document.getElementById('start-btn');

    function updateTimerDisplay() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        startBtn.textContent = 'Start';
        isRunning = false;
      } else {
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            alert('Timer finished! Time to take a break or move to the next task.');
            resetTimer();
          }
        }, 1000);
        startBtn.textContent = 'Pause';
        isRunning = true;
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      totalSeconds = initialSeconds;
      isRunning = false;
      startBtn.textContent = 'Start';
      updateTimerDisplay();
    }

    function setTimerMode(minutes, element) {
      document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      initialSeconds = minutes * 60;
      resetTimer();
    }


    /* ================= TO-DO LIST (WITH LOCALSTORAGE) ================= */
    let todos = JSON.parse(localStorage.getItem('dev_todos')) || [];

    function saveAndRender() {
      localStorage.setItem('dev_todos', JSON.stringify(todos));
      renderTodos();
    }

    function renderTodos() {
      const listEl = document.getElementById('todo-list');
      listEl.innerHTML = '';

      if (todos.length === 0) {
        listEl.innerHTML = '<li style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 1rem 0;">No tasks added yet.</li>';
        return;
      }

      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="todo-content" onclick="toggleTodo(${index})">
            <input type="checkbox" ${todo.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTodo(${index})">
            <span>${escapeHTML(todo.text)}</span>
          </div>
          <button class="btn-delete" onclick="deleteTodo(${index})">&times;</button>
        `;
        listEl.appendChild(li);
      });
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (text !== '') {
        todos.push({ text: text, completed: false });
        input.value = '';
        saveAndRender();
      }
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      saveAndRender();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      saveAndRender();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        addTodo();
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Initial Render of Tasks
    renderTodos();
  </script>
</body>
</html>
